<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Serendipity Drift</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <svg class="chrome-logo" viewBox="0 0 48 48" width="24" height="24" fill="none" aria-hidden="true">
          <defs>
            <clipPath id="sdLogoEye">
              <circle cx="24" cy="24.5" r="16"/>
            </clipPath>
          </defs>
          <circle cx="24" cy="24" r="22" fill="#9fdcc8"/>
          <circle cx="24" cy="24.5" r="16" fill="#ffffff"/>
          <g clip-path="url(#sdLogoEye)">
            <circle cx="29.5" cy="26.5" r="9.5" fill="#3a9d8a"/>
            <circle cx="32.2" cy="27.6" r="5.2" fill="#1f2a37"/>
            <circle cx="27.6" cy="22.8" r="2" fill="#ffffff"/>
            <path d="M4 4H44V19.5L4 14.5Z" fill="#74c5ae"/>
            <path d="M4 14.5L44 19.5" stroke="#3a9d8a" stroke-width="1.4"/>
          </g>
        </svg>
        <div>
          <h1>Serendipity Drift</h1>
          <p>Chrome Built-in AI 온디바이스 검색</p>
        </div>
      </div>
    </header>

    <section class="status-card" aria-live="polite">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot" aria-hidden="true"></span>
        <span class="status-title" id="status-title">AI 모델 점검 중...</span>
      </div>
      <p class="status-desc" id="status-desc">브라우저 내장 Gemini Nano 가용성을 확인하고 있습니다.</p>
      <progress id="download-progress" class="download-progress" max="1" hidden></progress>
      <button type="button" id="download-btn" class="action-btn action-secondary" hidden>
        ⬇️ Gemini Nano 모델 다운로드
      </button>
    </section>

    <div class="quick-actions">
      <button type="button" id="open-panel-btn" class="action-btn action-primary">
        📖 사이드패널 열기
      </button>
    </div>

    <label class="setting-row" for="auto-run-toggle">
      <span>
        <strong>구글 검색 시 자동 비틀기</strong>
        끄면 검색 결과 상단의 ⚡ 버튼을 눌렀을 때만 실행합니다.
      </span>
      <input type="checkbox" id="auto-run-toggle">
    </label>

    <section class="usage-guide">
      <h2>⚡ 주요 사용법</h2>
      <ul class="guide-list">
        <li>
          <strong>1. 크롬 주소창</strong>
          <span>주소창에 <code>drift 검색어</code>를 치면 비틀린 검색어가 자동 추천됩니다.</span>
        </li>
        <li>
          <strong>2. 구글 검색창</strong>
          <span>구글 검색 시 결과 상단에 4단계 비틀린 검색어 카드가 나타납니다.</span>
        </li>
        <li>
          <strong>3. 사유의 가지치기</strong>
          <span>조각을 클릭하여 새로운 시발점으로 도약할 수 있습니다.</span>
        </li>
      </ul>
    </section>

    <footer class="popup-footer">
      <button type="button" id="flags-guide-link" class="link-btn">⚙️ Gemini Nano 활성화 가이드</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
