<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Serendipity Drift</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <svg class="chrome-logo" viewBox="0 0 48 48" width="28" height="28" fill="none" aria-hidden="true">
          <defs>
            <clipPath id="sdLogoEye">
              <circle cx="24" cy="24.5" r="16"/>
            </clipPath>
          </defs>
          <circle cx="24" cy="24" r="22" fill="#9fdcc8"/>
          <circle cx="24" cy="24.5" r="16" fill="#ffffff"/>
          <g clip-path="url(#sdLogoEye)">
            <circle cx="29.5" cy="26.5" r="9.5" fill="#3a9d8a"/>
            <circle cx="32.2" cy="27.6" r="5.2" fill="#1f2a37"/>
            <circle cx="27.6" cy="22.8" r="2" fill="#ffffff"/>
            <path d="M4 4H44V19.5L4 14.5Z" fill="#74c5ae"/>
            <path d="M4 14.5L44 19.5" stroke="#3a9d8a" stroke-width="1.4"/>
          </g>
        </svg>
        <div class="logo-text">
          <h1 class="logo-title">Serendipity Drift</h1>
          <p class="logo-sub">Chrome Built-in AI · 사유 탈선 탐색기</p>
        </div>
      </div>
      <button type="button" id="ai-status-pill" class="status-pill" title="Gemini Nano 모델 상태">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">모델 확인 중</span>
      </button>
    </header>

    <!-- Exploration Breadcrumbs -->
    <nav id="history-trail" class="history-trail" aria-label="사유의 궤적" hidden>
      <span class="trail-label">사유의 궤적:</span>
      <div id="trail-items" class="trail-items"></div>
    </nav>

    <!-- Search & Control Panel -->
    <section class="control-panel" aria-label="검색 설정">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          type="text"
          id="query-input"
          class="query-input"
          placeholder="검색어를 입력하거나 탭에서 가져오세요..."
          aria-label="검색어"
          autocomplete="off"
        />
        <button type="button" id="sync-tab-btn" class="icon-btn" title="현재 탭의 검색어 가져오기" aria-label="현재 탭의 검색어 가져오기">
          🔄
        </button>
      </div>

      <div class="vector-selector-row">
        <label for="vector-select" class="vector-label">사유 벡터</label>
        <div class="select-wrapper">
          <select id="vector-select" class="vector-select">
            <!-- 기본 '관련 카테고리 내 변환' 및 16개 사유 벡터가 JS로 로드됩니다 -->
          </select>
        </div>
        <button type="button" id="random-vector-btn" class="icon-btn" title="사유 벡터 무작위 셔플" aria-label="사유 벡터 무작위 셔플">
          🎲
        </button>
      </div>

      <div class="mode-toggle" role="radiogroup" aria-label="결과 보기 방식">
        <button type="button" class="mode-btn" role="radio" data-mode="image" aria-checked="true">🖼️ 이미지</button>
        <button type="button" class="mode-btn" role="radio" data-mode="video" aria-checked="false">🎬 동영상</button>
        <button type="button" class="mode-btn" role="radio" data-mode="text" aria-checked="false">📝 텍스트</button>
      </div>

      <div class="action-row">
        <button type="button" id="run-drift-btn" class="btn btn-primary">
          <span class="btn-icon" aria-hidden="true">⚡</span>
          <span class="btn-label">의도 비틀어 탐색하기</span>
        </button>
      </div>
    </section>

    <!-- Vector Information Banner -->
    <div id="active-vector-banner" class="active-vector-banner" hidden>
      <div class="vector-badge" id="banner-vector-title"></div>
      <p class="vector-prompt" id="banner-vector-prompt"></p>
    </div>

    <!-- Action Legend Bar -->
    <div id="dock-legend-bar" class="dock-legend-bar" hidden>
      <span class="legend-item"><span class="legend-icon" aria-hidden="true">🔍</span> 크롬 검색</span>
      <span class="legend-dot" aria-hidden="true">•</span>
      <span class="legend-item"><span class="legend-icon" aria-hidden="true">🌱</span> 이 조각으로 도약</span>
      <span class="legend-dot" aria-hidden="true">•</span>
      <span class="legend-item"><span class="legend-icon" aria-hidden="true">✂️</span> 구절 분해</span>
    </div>

    <!-- Error State -->
    <div id="error-state" class="error-state" role="alert" hidden>
      <span aria-hidden="true">⚠️</span>
      <div>
        <strong>비틀기에 실패했습니다</strong>
        <span id="error-message"></span>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="loading-state" role="status" hidden>
      <svg class="eye-spinner" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <defs>
          <clipPath id="sdSpinEye">
            <circle cx="24" cy="24.5" r="16"/>
          </clipPath>
        </defs>
        <circle class="eye-hue-ring" cx="24" cy="24" r="22" fill="currentColor"/>
        <circle cx="24" cy="24.5" r="16" fill="#ffffff"/>
        <g clip-path="url(#sdSpinEye)">
          <g class="eye-orbit">
            <circle class="eye-hue-iris" cx="29.5" cy="26.5" r="9.5" fill="currentColor"/>
            <circle cx="32.2" cy="27.6" r="5.2" fill="#1f2a37"/>
            <circle class="eye-glint" cx="27.6" cy="22.8" r="2" fill="#ffffff"/>
          </g>
          <path class="eye-hue-lid" d="M4 4H44V19.5L4 14.5Z" fill="currentColor"/>
          <path class="eye-hue-iris" d="M4 14.5L44 19.5" stroke="currentColor" stroke-width="1.4"/>
        </g>
      </svg>
      <p id="loading-message" class="loading-text">사유의 틈새를 직조하는 중...</p>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state">
      <div class="empty-icon-wrapper" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="56" height="56" fill="none">
          <circle class="empty-icon-bg" cx="24" cy="24" r="20"/>
          <path d="M16 24C16 19.58 19.58 16 24 16C28.42 16 32 19.58 32 24C32 28.42 28.42 32 24 32" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="4" fill="#ea4335"/>
          <circle cx="34" cy="18" r="2.5" fill="#fbbc04"/>
          <circle cx="14" cy="30" r="2.5" fill="#34a853"/>
        </svg>
      </div>
      <h2 class="empty-title">의도에서 조금 벗어난 탐색</h2>
      <p>원하는 단어를 검색하면 Chrome 내장 AI가 1단계부터 4단계까지 점진적으로 확장된 도약 검색어를 생성합니다.</p>
      <div class="empty-tips">
        <span class="tip-badge">Tip</span> 주소창에 <code>drift 검색어</code>를 입력해도 즉시 탐색됩니다!
      </div>
    </div>

    <!-- Card Stack Container -->
    <main id="card-stack" class="card-stack" aria-label="비틀린 검색어 4단계" hidden></main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-links">
        <button type="button" id="open-flags-guide" class="footer-link">⚙️ Gemini Nano 설정 가이드</button>
        <button type="button" id="clear-trail-btn" class="footer-link">🗑️ 궤적 초기화</button>
      </div>
    </footer>
  </div>

  <!-- 이미지 확대 보기 -->
  <dialog id="lightbox" class="lightbox" aria-label="이미지 확대 보기">
    <button type="button" class="lightbox-close" aria-label="닫기">✕</button>
    <img class="lightbox-img" alt="">
    <div class="lightbox-meta">
      <p class="lightbox-title"></p>
      <a class="lightbox-source" target="_blank" rel="noopener noreferrer">원본 페이지 ↗</a>
    </div>
  </dialog>

  <script src="stage-eye.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
